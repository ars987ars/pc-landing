<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Заявки — PC Master</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0F1620; --bg-elevated:#161F2C; --bg-elevated-2:#1C2734;
    --line:#2B3849; --line-strong:#3C4C60;
    --text:#E7EBEF; --text-muted:#8E9BAC;
    --accent:#C9823E; --accent-strong:#E0954A;
    --danger:#C75C4E;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font-family:'IBM Plex Sans',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:24px;
  }
  .mono{font-family:'IBM Plex Mono',monospace;}
  header{
    padding:16px 16px 8px;position:sticky;top:0;background:var(--bg);z-index:10;
    border-bottom:1px solid var(--line);
  }
  header .row{display:flex;justify-content:space-between;align-items:center;}
  header h1{font-size:1.15rem;margin:0;font-weight:600;}
  .refresh-btn{
    background:none;border:1px solid var(--line-strong);color:var(--text-muted);
    padding:6px 10px;border-radius:4px;font-size:0.82rem;font-family:inherit;
  }
  .tabs{display:flex;gap:6px;margin-top:14px;overflow-x:auto;padding-bottom:8px;}
  .tab{
    flex:none;padding:8px 12px;border-radius:4px;border:1px solid var(--line);
    background:var(--bg-elevated);color:var(--text-muted);font-size:0.82rem;font-family:inherit;
    white-space:nowrap;
  }
  .tab.active{border-color:var(--accent);color:var(--text);background:var(--bg-elevated-2);}
  .tab .count{font-family:'IBM Plex Mono',monospace;color:var(--accent);margin-left:4px;}

  main{padding:14px 16px;}
  .state-msg{
    text-align:center;color:var(--text-muted);padding:48px 16px;font-size:0.9rem;
  }
  .card{
    background:var(--bg-elevated);border:1px solid var(--line);border-left:3px solid var(--accent);
    border-radius:4px;padding:14px 16px;margin-bottom:12px;
  }
  .card .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
  .card .name{font-weight:600;font-size:1rem;}
  .card .date{font-size:0.72rem;color:var(--text-muted);white-space:nowrap;font-family:'IBM Plex Mono',monospace;}
  .card .contact{margin-top:4px;font-size:0.88rem;color:var(--text-muted);}
  .card .meta{margin-top:8px;font-size:0.85rem;border-top:1px solid var(--line);padding-top:8px;}
  .card .meta .k{color:var(--text-muted);}
  .card .task{margin-top:4px;font-size:0.85rem;}
  .card .advance{
    margin-top:12px;width:100%;padding:9px;background:var(--accent);color:#12140F;
    border:none;border-radius:4px;font-weight:600;font-size:0.85rem;font-family:inherit;
  }
  .card .advance:active{background:var(--accent-strong);}
  .archive-tag{margin-top:12px;font-size:0.78rem;color:var(--text-muted);}
</style>
</head>
<body>

<header>
  <div class="row">
    <h1>Заявки</h1>
    <button class="refresh-btn" id="refresh">Обновить</button>
  </div>
  <div class="tabs" id="tabs"></div>
</header>

<main id="main">
  <div class="state-msg">Загрузка…</div>
</main>

<script>
  // Вставь сюда адрес своего Worker'а (тот же, что в landing.html)
  var WORKER_URL = 'https://tg-lead-notify.makirushka2007.workers.dev/';

  var STATUSES = [
    { key: 'new', label: 'Новые', nextLabel: '→ Взять в работу' },
    { key: 'in_progress', label: 'В работе', nextLabel: '→ Завершить' },
    { key: 'done', label: 'Завершено', nextLabel: '→ В архив' },
    { key: 'archive', label: 'Архив', nextLabel: null }
  ];

  var tg = window.Telegram ? window.Telegram.WebApp : null;
  var initData = tg ? tg.initData : '';
  if (tg) {
    tg.ready();
    tg.expand();
    try {
      tg.setHeaderColor('#0F1620');
      tg.setBackgroundColor('#0F1620');
    } catch (e) {}
  }

  var state = { orders: [], activeTab: 'new', loading: true, error: null };

  function formatDate(raw) {
    if (!raw) return '';
    var d = new Date(raw.replace(' ', 'T') + 'Z');
    return d.toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
  }

  function renderTabs() {
    var tabsEl = document.getElementById('tabs');
    tabsEl.innerHTML = '';
    STATUSES.forEach(function (s) {
      var count = state.orders.filter(function (o) { return o.status === s.key; }).length;
      var btn = document.createElement('button');
      btn.className = 'tab' + (state.activeTab === s.key ? ' active' : '');
      btn.innerHTML = s.label + ' <span class="count">' + count + '</span>';
      btn.onclick = function () { state.activeTab = s.key; render(); };
      tabsEl.appendChild(btn);
    });
  }

  function advance(id, btn) {
    btn.disabled = true;
    btn.textContent = 'Двигаем…';
    fetch(WORKER_URL + '/api/orders/' + id + '/advance', {
      method: 'POST',
      headers: { 'X-Telegram-Init-Data': initData }
    })
      .then(function (res) { if (!res.ok) throw new Error('fail'); return res.json(); })
      .then(function (data) {
        var order = state.orders.find(function (o) { return o.id === id; });
        if (order) order.status = data.status;
        render();
      })
      .catch(function () {
        btn.disabled = false;
        btn.textContent = 'Не получилось, попробуй ещё раз';
      });
  }

  function renderMain() {
    var mainEl = document.getElementById('main');
    mainEl.innerHTML = '';

    if (state.loading) {
      mainEl.innerHTML = '<div class="state-msg">Загрузка…</div>';
      return;
    }
    if (state.error === 'forbidden') {
      mainEl.innerHTML = '<div class="state-msg">Доска доступна только команде.<br>Попроси добавить тебя в группу бота.</div>';
      return;
    }
    if (state.error) {
      mainEl.innerHTML = '<div class="state-msg">Не получилось загрузить заявки.<br>Попробуй обновить.</div>';
      return;
    }

    var statusDef = STATUSES.find(function (s) { return s.key === state.activeTab; });
    var items = state.orders.filter(function (o) { return o.status === state.activeTab; });

    if (items.length === 0) {
      mainEl.innerHTML = '<div class="state-msg">Пока пусто</div>';
      return;
    }

    items.forEach(function (o) {
      var card = document.createElement('div');
      card.className = 'card';

      var html = '';
      html += '<div class="top"><span class="name"></span><span class="date mono"></span></div>';
      html += '<div class="contact"></div>';
      html += '<div class="meta"><span class="k">Бюджет: </span><span class="budget"></span></div>';
      html += '<div class="task"></div>';
      card.innerHTML = html;

      card.querySelector('.name').textContent = o.name;
      card.querySelector('.date').textContent = formatDate(o.created_at);
      card.querySelector('.contact').textContent = o.contact;
      card.querySelector('.budget').textContent = o.budget || '—';
      card.querySelector('.task').textContent = o.task || '';

      if (statusDef.nextLabel) {
        var btn = document.createElement('button');
        btn.className = 'advance';
        btn.textContent = statusDef.nextLabel;
        btn.onclick = function () { advance(o.id, btn); };
        card.appendChild(btn);
      } else {
        var tag = document.createElement('div');
        tag.className = 'archive-tag';
        tag.textContent = 'В архиве';
        card.appendChild(tag);
      }

      mainEl.appendChild(card);
    });
  }

  function render() {
    renderTabs();
    renderMain();
  }

  function load() {
    state.loading = true;
    state.error = null;
    render();

    fetch(WORKER_URL + '/api/orders', {
      headers: { 'X-Telegram-Init-Data': initData }
    })
      .then(function (res) {
        if (res.status === 403) { state.error = 'forbidden'; throw new Error('forbidden'); }
        if (!res.ok) throw new Error('fail');
        return res.json();
      })
      .then(function (data) {
        state.orders = data.orders || [];
        state.loading = false;
        render();
      })
      .catch(function () {
        state.loading = false;
        if (!state.error) state.error = 'fail';
        render();
      });
  }

  document.getElementById('refresh').onclick = load;
  load();
</script>

</body>
</html>
